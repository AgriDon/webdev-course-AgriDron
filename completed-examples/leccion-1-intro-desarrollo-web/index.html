<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lección 1: contenido + estilo</title>

    <!--
        CSS = el ESTILO (cómo se ve).
        Esta página tiene tres "ropas" distintas. Cambia el nombre del archivo
        de abajo para vestirla de otra forma, sin tocar el contenido:
          - estilo-claro.css
          - estilo-oscuro.css
          - estilo-naturaleza.css
        Si borras esta línea, verás la página "aburrida": solo HTML.
    -->
    <link rel="stylesheet" href="estilo-claro.css">
</head>
<body>

<!-- HTML = el CONTENIDO (qué hay en la página y en qué orden) -->

<!-- 1. Un título -->
<h1>Mi página</h1>

<!-- 2. Un párrafo -->
<p>Hola, me gusta dibujar y jugar fútbol.</p>

<!-- 3. Una imagen -->
<img src="https://upload.wikimedia.org/wikipedia/commons/6/61/HTML5_logo_and_wordmark.svg"
     alt="Logo de HTML5">

<!-- 4. Un enlace -->
<p><a href="https://developer.mozilla.org/es/docs/Learn_web_development">Ver más</a></p>

<!-- 5. El botón del video: HTML dice que hay un botón con el texto "Suscribirse";
        el CSS decide si es rojo, redondeado y con letras blancas. -->
<button type="button">Suscribirse</button>

</body>
</html>
